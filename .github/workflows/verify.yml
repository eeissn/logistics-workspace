name: Verify Logistics Workspace

on:
  push:
    branches: [feature/two-user-sync, 'feature/two-user-sync-*', feature/ui-polish-agent-next, codex/release-candidate, codex/sputnik-workspace, codex/sputnik-mobile-review, codex/active-queue-monthly-history, codex/bulk-etrn-safe, feature/visible-rates-margin, feature/release-pdf-worker-health, feature/backup-delivery-verified-receipts, feature/schedule-year-boundary, feature/backup-acceptance-changelog, feature/backup-restored-account-isolation, feature/iso-schedule-today-filter, feature/large-year-server-regression, feature/large-year-browser-smoke, feature/chat-audit-roadmap-reconcile, feature/p1-excel-lab, feature/p1-workspace-design-system, feature/p1-feedback-etrn-ux, feature/p1-ten-ideas-workspace]
  pull_request:
    branches: [feature/two-user-sync]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test API and SQLite
        run: |
          python -m pip install -r backend/requirements-test.txt
          python -m unittest backend.test_app backend.test_bulk_etrn -v
          python -m unittest backend.test_sheets -v
          python -m unittest deploy.test_backup_delivery -v
      - name: Validate release check
        run: |
          bash -n deploy/check-release.sh
          bash test/check-release.sh
      - name: Test and build frontend
        env:
          VITE_DEMO: 'false'
        run: |
          npm ci
          npm test
          npm run build
          test "$(find dist/assets -maxdepth 1 -type f -name 'pdf.worker*.mjs' | wc -l)" -eq 1
      - name: Check built app in Chromium and mobile WebKit
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
          python -m backend.browser_smoke
