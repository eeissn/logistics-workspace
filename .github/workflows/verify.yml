name: Verify Logistics Workspace

on:
  push:
    branches: ['feature/p0-backup-freshness-current-release-20261118', 'fix/p0-failed-trip-margin-in-financial-reports-20261118', 'feature/manual-margin-in-order-editor-20261118', 'fix/manual-etrn-close-active-queue-20261117', 'fix/active-etrn-desktop-focus-20261117', 'fix/release-local-tls-dns-bypass', 'feature/apple-attio-polish-20261117', 'fix/post-release-ux-etrn-navigation', 'release/**', feature/two-user-sync, 'feature/two-user-sync-*', feature/ui-polish-agent-next, codex/release-candidate, codex/sputnik-workspace, codex/sputnik-mobile-review, codex/active-queue-monthly-history, codex/bulk-etrn-safe, feature/visible-rates-margin, feature/release-pdf-worker-health, feature/backup-delivery-verified-receipts, feature/schedule-year-boundary, feature/backup-acceptance-changelog, feature/backup-restored-account-isolation, feature/iso-schedule-today-filter, feature/large-year-server-regression, feature/large-year-browser-smoke, feature/chat-audit-roadmap-reconcile, feature/p1-excel-lab, feature/p1-workspace-design-system, feature/p1-feedback-etrn-ux, feature/p1-ten-ideas-workspace]
  pull_request:
    branches: [feature/two-user-sync]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Playwright's Ubuntu apt mirror can stall during large WebKit dependency downloads.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test API and SQLite
        run: |
          python -m pip install -r backend/requirements-test.txt
          python -m unittest backend.test_app backend.test_bulk_etrn -v
          python -m unittest backend.test_sheets -v
          python -m unittest deploy.test_backup_delivery deploy.test_backup_freshness -v
      - name: Validate release check
        run: |
          bash -n deploy/check-release.sh
          bash test/check-release.sh
      - name: Test and build frontend
        env:
          VITE_DEMO: 'false'
        run: |
          npm ci
          npm test
          npm run build
          test "$(find dist/assets -maxdepth 1 -type f -name 'pdf.worker*.mjs' | wc -l)" -eq 1
      - name: Check built app in Chromium and mobile WebKit
        env:
          WORKSPACE_SMOKE_SCREENSHOTS: ${{ runner.temp }}/workspace-screenshots
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
          mkdir -p "$WORKSPACE_SMOKE_SCREENSHOTS"
          python -m backend.browser_smoke
      - name: Preserve visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-visual-qa
          path: ${{ runner.temp }}/workspace-screenshots/
          if-no-files-found: ignore
          retention-days: 7
