name: Publish UX 2.0 preview (isolated GitHub Pages)

on:
  push:
    branches: [feature/p1-workspace-design-system, feature/p1-feedback-etrn-ux, feature/p1-ten-ideas-workspace]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux-preview-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'eeissn/logistics-workspace'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test frontend and build isolated UX preview
        env:
          VITE_DEMO: 'true'
          VITE_UX_PREVIEW: 'true'
          VITE_EXCEL_LAB: 'false'
          VITE_SHEET_PREVIEW: 'false'
        run: |
          npm ci
          npm test
          npm run build
      - name: Browser smoke in Chromium with mobile emulation
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python -m backend.ux_preview_smoke
      - name: Publish only /ux-preview/ while preserving other Pages demos
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/ux-preview-pages origin/gh-pages
          mkdir -p /tmp/ux-preview-pages/ux-preview
          find /tmp/ux-preview-pages/ux-preview -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a dist/. /tmp/ux-preview-pages/ux-preview/
          touch /tmp/ux-preview-pages/.nojekyll
          git -C /tmp/ux-preview-pages add ux-preview .nojekyll
          if git -C /tmp/ux-preview-pages diff --cached --quiet; then
            echo 'No UX preview changes.'
            exit 0
          fi
          git -C /tmp/ux-preview-pages config user.name 'github-actions[bot]'
          git -C /tmp/ux-preview-pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/ux-preview-pages commit -m "pages: UX preview from ${GITHUB_SHA:0:8}"
          git -C /tmp/ux-preview-pages push origin HEAD:gh-pages
